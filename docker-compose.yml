version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: travel_postgres_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-travel_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-travel_password}
      - POSTGRES_DB=${POSTGRES_DB:-travel_app_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: